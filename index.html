<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Erinnerungen">
<meta name="theme-color" content="#faf8f7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Meine Erinnerungen</title>
<style>
/* Pastell-Farben: hier zentral änderbar */
:root{--bg:#faf8f7;--card:#fff;--text:#4a4458;--soft:#9a93a8;--line:#efe8f0;--accent:#cdb4f6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,system-ui,sans-serif;
 padding:env(safe-area-inset-top) 0 calc(80px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto;padding:16px}
#chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.chip{flex:none;border:0;border-radius:20px;padding:8px 14px;background:var(--c,#eee);color:var(--text);font:inherit;opacity:.65}
.chip.on{opacity:1;box-shadow:0 0 0 2px var(--text) inset}
h1{display:flex;align-items:center;justify-content:space-between;font-size:28px;margin:16px 0 8px}
h1 button{border:0;background:none;font-size:22px}
ul{list-style:none;margin:0;padding:0}
.todo{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:16px;padding:12px;margin-bottom:8px;
 transition:opacity .3s,transform .3s}
.todo.leaving{opacity:0;transform:translateX(40px)}
.check{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--c);background:#fff;margin-top:1px}
.done .check{background:var(--c)}
.done .tt{text-decoration:line-through;color:var(--soft)}
.txt{flex:1;min-width:0}
.meta{font-size:13px;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{text-align:center;color:var(--soft);padding:40px 0}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);padding:10px 16px calc(10px + env(safe-area-inset-bottom));
 display:flex;gap:8px;max-width:640px;margin:0 auto}
input,textarea,select,.btn{font:inherit;color:var(--text)}
#bar input{flex:1}
input[type=text],input[type=number],input[type=datetime-local],textarea,select{width:100%;border:1.5px solid var(--line);
 border-radius:12px;padding:10px;background:#fff}
.btn{border:0;border-radius:12px;padding:10px 16px;background:var(--accent)}
.btn.red{background:#f9c6c9}.btn.grey{background:var(--line)}
dialog{border:0;border-radius:20px;padding:20px;width:min(92vw,440px);background:var(--bg);color:var(--text)}
dialog::backdrop{background:#4a445855}
dialog label.f{display:block;font-size:13px;color:var(--soft);margin:12px 0 4px}
.row{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.pick{background:var(--c);border-radius:14px;padding:6px 10px;font-size:14px}
.icons{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-height:140px;overflow:auto}
.icons button{border:2px solid transparent;background:#fff;border-radius:10px;font-size:22px;padding:4px}
.icons button.on{border-color:var(--text)}
.colorrow{display:flex;gap:8px}.colorrow input[type=color]{width:52px;height:44px;border:0;padding:0;background:none}

/* ===== Neues Layout: Listenübersicht + Todo-Ansicht ===== */
[hidden]{display:none!important}
body{padding:0;overflow:hidden}
#app{display:flex;height:100dvh}
section{position:relative;display:flex;flex-direction:column;flex:1;min-width:0;padding:env(safe-area-inset-top) 16px 0}
section header{display:flex;align-items:center;gap:8px;padding:16px 0 8px}
header h1{flex:1;margin:0;font-size:28px;display:block}
#tools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
#search{flex:1 1 90px;width:90px;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff;font:inherit;color:var(--text)}
.scroll{flex:1;overflow:auto;padding-bottom:100px}
.lcard{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:10px 12px;margin-bottom:8px}
.dot{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.ic{filter:brightness(0) invert(1);font-size:19px;line-height:1} /* macht das Emoji weiß */
.ln{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{color:var(--soft);font-size:18px}
.cat{font-weight:600;color:var(--soft);margin:16px 4px 8px}
.cat button,.lcard button,#back,#editList{border:0;background:none;font-size:18px;color:var(--text)}
.fab{position:absolute;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;
 border:0;font-size:32px;line-height:1;color:var(--text);background:var(--c,var(--accent));box-shadow:0 4px 12px #0002}
#app:not(.detail) #detail{display:none}
#app.detail #lists{display:none}
@media(min-width:700px){
 #lists{flex:0 0 290px;border-right:1px solid var(--line);margin-right:16px} /* feste, schmale Breite */
 #app #lists,#app #detail{display:flex!important}
 #back{display:none}
}
#menuBtn{border:0;background:none;font-size:26px;line-height:1;color:var(--text);padding:0 4px}
#menu{position:absolute;right:16px;top:calc(env(safe-area-inset-top) + 56px);z-index:5;background:#fff;border-radius:14px;box-shadow:0 6px 20px #0002;padding:6px;display:flex;flex-direction:column}
#menu button{border:0;background:none;text-align:left;padding:10px 14px;font:inherit;color:var(--text);border-radius:10px;white-space:nowrap}
.grip{font-size:20px;color:var(--soft);padding:4px 8px;touch-action:none;cursor:grab;user-select:none}
.lcard.drag{position:relative;z-index:10;box-shadow:0 8px 20px #0003}
.drop-before{box-shadow:0 -3px 0 var(--soft)}
.drop-after{box-shadow:0 3px 0 var(--soft)}
#tools .btn{background:#f1efee;padding:7px 12px;border-radius:10px;font-size:15px} /* kleiner, neutral-grauer Hintergrund */
.cat button{font-size:14px;color:var(--soft);margin-left:6px}
.cat{cursor:pointer;user-select:none}
.arr{display:inline-block;width:16px}
#title{color:var(--c)} /* Listenname in der Listenfarbe */
/* Todo-Dialog ohne Farben */
dialog .btn,dialog .btn.red,dialog .btn.grey{background:#f1efee;padding:7px 12px;border-radius:10px;font-size:15px} /* alle Fenster: kleiner neutraler Hintergrund */
#todoDlg #tSave{font-weight:600}
#todoDlg .pick{background:none;padding:6px 10px 6px 0}
#todoDlg input[type=checkbox]{accent-color:var(--text)}
#todoDlg .pick{display:flex;align-items:center;gap:8px;width:100%;padding:4px 0}
.dot.sm{width:26px;height:26px}
.dot.sm .ic{font-size:14px}
#tRepeat,#tWd{margin-top:8px}
.wd{display:inline-flex;align-items:center;gap:4px;margin-right:10px}
#todoDlg .wd input{accent-color:var(--text)}
.todo{background:none;padding:10px 0;margin-bottom:0} /* Todos in der Liste ohne Kartenhintergrund */
.chev{color:var(--soft);font-size:22px;line-height:1;margin-left:2px}
</style>
</head>
<body>
<div id="app">
  <section id="lists">
    <header><h1>Alle Listen</h1><button id="menuBtn" aria-label="Menü">⋯</button></header>
    <div id="menu" hidden><button id="mSearch">Suchen</button><button id="mEdit">Listen bearbeiten</button></div>
    <div id="tools" hidden>
      <input type="search" id="search" placeholder="Suchen …" hidden>
      <button class="btn grey" id="closeSearch" hidden>✕</button>
      <button class="btn grey" id="newCat" hidden>＋ Kategorie</button>
      <button class="btn grey" id="doneBtn" hidden>Fertig</button>
    </div>
    <div class="scroll" id="listArea"></div>
    <button class="fab" id="addList" aria-label="Neue Liste">＋</button>
  </section>
  <section id="detail">
    <header><button id="back">‹</button><h1 id="title"></h1></header>
    <ul class="scroll" id="todos"></ul>
    <button class="fab" id="addTodo" aria-label="Neues Todo">＋</button>
  </section>
</div>

<!-- Dialog: Todo bearbeiten -->
<dialog id="todoDlg">
  <label class="f">Titel</label><input type="text" id="tTitle">
  <label class="f">Datum &amp; Uhrzeit</label><input type="datetime-local" id="tDue">
  <label class="f">Kommentar</label><textarea id="tNote" rows="3"></textarea>
  <label class="f">In diesen Listen</label><div class="picks" id="tLists"></div>
  <label class="f">Wenn erledigt …</label>
  <select id="tMode"><option value="strike">durchgestrichen anzeigen</option><option value="remove">verschwinden</option></select>
  <label class="f">Wiederholung</label>
  <select id="tUnit"><option value="none">Keine</option><option value="days">Alle X Tage</option><option value="hours">Alle X Stunden</option><option value="weekdays">An bestimmten Wochentagen</option></select>
  <input type="number" id="tRepeat" min="1" placeholder="Anzahl">
  <div class="picks" id="tWd"></div>
  <div class="row"><button class="btn red" id="tDel">Löschen</button><button class="btn grey" id="tCancel">Abbrechen</button><button class="btn" id="tSave">Fertig</button></div>
</dialog>

<!-- Dialog: Kategorie -->
<dialog id="catDlg">
  <label class="f">Name der Kategorie</label><input type="text" id="cName">
  <div class="row"><button class="btn red" id="cDel">Löschen</button><button class="btn grey" id="cCancel">Abbrechen</button><button class="btn" id="cSave">Fertig</button></div>
</dialog>

<!-- Dialog: Liste bearbeiten -->
<dialog id="listDlg">
  <label class="f">Name</label><input type="text" id="lName">
  <label class="f">Kategorie</label><select id="lCat"></select>
  <label class="f">Farbe (Farbkreis oder #Hex-Code)</label>
  <div class="colorrow"><input type="color" id="lColor"><input type="text" id="lHex" maxlength="7"></div>
  <label class="f">Icon</label><div class="icons" id="lIcons"></div>
  <div class="row"><button class="btn red" id="lDel">Löschen</button><button class="btn grey" id="lCancel">Abbrechen</button><button class="btn" id="lSave">Fertig</button></div>
</dialog>

<script>
// ---------- Daten ----------
const KEY = 'erinnerungen-v1';
// Aufbau: lists = [{id,name,color,icon}], todos = [{id,title,done,doneAt,lists:[ids],mode,repeat,due,note}]
let S = JSON.parse(localStorage.getItem(KEY) || 'null') ||
  { lists: [{ id: 'l1', name: 'Allgemein', color: '#cdb4f6', icon: '📝' }], todos: [] };
S.cats = S.cats || [];                       // Kategorien: [{id,name}]
S.lists.forEach(l => l.cat = l.cat || '');   // jede Liste gehört zu keiner oder einer Kategorie
let cur = null;      // gewählte Liste (null = nur Übersicht)
let sortMode = false, searchOn = false;   // Bearbeiten-Modus / Suche aktiv
let editTodo = null, editList = null, pickedIcon = '📝';
const $ = s => document.querySelector(s);
const save = () => localStorage.setItem(KEY, JSON.stringify(S));
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ICONS = '📝 🛒 🏠 💼 🎓 💪 🍎 🍳 ☕ 🎵 🎮 📚 ✈️ 🚗 🚲 💊 💰 🎁 🎂 ❤️ ⭐ 🌱 🌸 🐶 🐱 🧹 🧺 📞 💻 📷 🎨 ✂️ 🔧 🏃 🧘 🛏️ 🌙 ☀️ ☂️ 🎬 🍕 🥗 🍰 🚿 🪴 📦 📅 🔔'.split(' ');

// ---------- Wiederholung: erledigte Todos wieder öffnen (nach X Tagen/Stunden oder am nächsten gewählten Wochentag) ----------
const pad = n => String(n).padStart(2, '0');
const toInput = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const TAGE = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];

// Wann soll ein erledigtes Todo wieder offen werden? (0 = nie)
function nextReopen(t) {
  if (t.unit === 'weekdays') {
    if (!t.wdays || !t.wdays.length) return 0;
    const d = new Date(t.doneAt); d.setHours(0, 0, 0, 0);
    for (let i = 1; i <= 7; i++) {                       // ab morgen den nächsten gewählten Wochentag suchen
      const c = new Date(d); c.setDate(d.getDate() + i);
      if (t.wdays.includes(c.getDay())) return c.getTime();   // 0 Uhr an diesem Tag
    }
    return 0;
  }
  if (!(t.repeat > 0)) return 0;
  return t.doneAt + t.repeat * (t.unit === 'hours' ? 36e5 : 864e5);   // Stunden oder Tage nach dem Abhaken
}

// Todo wieder öffnen und den Termin (falls vorhanden) auf den nächsten Termin schieben
function reopen(t) {
  const done = t.doneAt, at = t.reopenAt;
  t.done = false; t.doneAt = 0; t.reopenAt = 0;
  if (!t.due) return;
  let d = new Date(t.due);
  if (t.unit === 'weekdays') {                            // neuer Tag, gleiche Uhrzeit
    const o = d; d = new Date(at); d.setHours(o.getHours(), o.getMinutes(), 0, 0);
  } else {                                                // mindestens einmal weiter, bis der Termin nach dem Abhaken liegt
    let i = 0;
    do { t.unit === 'hours' ? d.setHours(d.getHours() + t.repeat) : d.setDate(d.getDate() + t.repeat); }
    while (d.getTime() <= done && ++i < 1000);
  }
  t.due = toInput(d);
}

// Text unter dem Todo, z. B. "alle 2 Tage" oder "jeden Freitag"
function repeatText(t) {
  if (t.unit === 'weekdays') {
    const w = (t.wdays || []).slice().sort((a, b) => (a || 7) - (b || 7));   // Sonntag ans Ende
    return !w.length ? '' : w.length === 1 ? 'jeden ' + TAGE[w[0]] : 'jeden ' + w.map(d => TAGE[d].slice(0, 2)).join(', ');
  }
  if (!(t.repeat > 0)) return '';
  const u = t.unit === 'hours' ? ['jede Stunde', 'Stunden'] : ['jeden Tag', 'Tage'];
  return t.repeat === 1 ? u[0] : `alle ${t.repeat} ${u[1]}`;
}

// Im Todo-Dialog nur die passenden Felder zeigen
function syncRepeat() {
  const u = $('#tUnit').value;
  $('#tRepeat').hidden = !(u === 'days' || u === 'hours');
  $('#tWd').hidden = u !== 'weekdays';
}
$('#tUnit').onchange = syncRepeat;
function resetRepeats() {
  let changed = false;
  S.todos.forEach(t => {
    if (!t.done) return;
    if (t.reopenAt == null) { t.reopenAt = nextReopen(t); changed = true; }   // Todos aus älteren Versionen
    if (t.reopenAt && Date.now() >= t.reopenAt) { reopen(t); changed = true; }
  });
  if (changed) save();
}

// ---------- Anzeige ----------
const isWide = () => matchMedia('(min-width:700px)').matches; // iPad = zwei Spalten

function listCard(l) {
  const n = S.todos.filter(t => !t.done && t.lists.includes(l.id)).length; // Anzahl offener Todos
  return `<div class="lcard ${l.id === cur ? 'on' : ''}" data-l="${l.id}">
    <span class="dot" style="background:${l.color}"><span class="ic">${l.icon}</span></span>
    <span class="ln">${esc(l.name)}</span>` +
    (sortMode ? '<span class="grip" aria-label="Verschieben">☰</span>' : `<span class="cnt">${n}</span><span class="chev">›</span>`) + '</div>';
}
function todoRow(t) {
  const meta = [
    t.due ? new Date(t.due).toLocaleString('de-DE', { dateStyle: 'short', timeStyle: 'short' }) : '',
    repeatText(t),
    t.note ? esc(t.note) : ''
  ].filter(Boolean).map(m => `<div class="meta">${m}</div>`).join('');   // jede Angabe in eigener Zeile
  return `<li class="todo ${t.done ? 'done' : ''}" data-id="${t.id}"><button class="check" aria-label="Erledigt"></button>
    <div class="txt"><div class="tt">${esc(t.title)}</div>${meta}</div></li>`;
}

function render() {
  resetRepeats();
  if (cur && !S.lists.find(l => l.id === cur)) cur = null;
  if (!cur && isWide() && S.lists.length) cur = S.lists[0].id;   // iPad: erste Liste automatisch öffnen

  // Linke Seite: Listen (ohne Kategorie zuerst, dann je Kategorie)
  const q = $('#search').value.toLowerCase();
  const vis = S.lists.filter(l => l.name.toLowerCase().includes(q));
  let h = vis.filter(l => !l.cat).map(listCard).join('');
  S.cats.forEach(c => {
    const ls = vis.filter(l => l.cat === c.id);
    if (ls.length || (sortMode && !q)) {
      const open = !c.collapsed || sortMode || q;   // eingeklappt = Listen der Kategorie ausblenden
      h += `<div class="cat" data-c="${c.id}"><span class="arr">${open ? '▾' : '▸'}</span>${esc(c.name)}${sortMode ? ' <button data-cedit>Bearbeiten</button>' : ''}</div>` + (open ? ls.map(listCard).join('') : '');
    }
  });
  $('#listArea').innerHTML = h || '<div class="empty">Noch keine Liste – tipp auf ＋</div>';
  $('#search').hidden = !searchOn; $('#closeSearch').hidden = !searchOn; $('#doneBtn').hidden = !sortMode;
  $('#tools').hidden = !(searchOn || sortMode);
  $('#newCat').hidden = !sortMode;

  // Rechte Seite: Todos der gewählten Liste
  const list = S.lists.find(l => l.id === cur);
  $('#app').classList.toggle('detail', !!list);
  $('#detail').style.setProperty('--c', list ? list.color : '#cdb4f6');   // Farbe für Kreise und ＋-Button
  $('#title').textContent = list ? list.name : '';
  $('#addTodo').hidden = !list;
  const items = list ? S.todos.filter(t => t.lists.includes(cur) && !(t.done && t.mode === 'remove')).sort((a, b) => a.done - b.done) : [];
  $('#todos').innerHTML = !list ? '<div class="empty">Wähle eine Liste</div>'
    : items.length ? items.map(todoRow).join('') : '';
}

// ---------- Erledigen (gilt für alle Listen, weil das Todo nur einmal existiert) ----------
function toggle(id) {
  const t = S.todos.find(x => x.id === id);
  t.done = !t.done;
  t.doneAt = t.done ? Date.now() : 0;
  t.reopenAt = t.done ? nextReopen(t) : 0;      // Zeitpunkt, an dem es wieder offen wird
  save();
  const li = document.querySelector(`[data-id="${id}"]`);
  if (t.done && t.mode === 'remove' && li) { li.classList.add('leaving'); setTimeout(render, 350); }
  else render();
}

// ---------- Listen sortieren und Kategorien ----------
// Drag & Drop (Maus und Touch): am ☰ ziehen, loslassen = Liste landet an der neuen Stelle
let drag = null;
$('#listArea').addEventListener('pointerdown', e => {
  const grip = e.target.closest('.grip'); if (!grip) return;
  const card = grip.closest('.lcard');
  drag = { id: card.dataset.l, card, startY: e.clientY, t: null, after: false };
  grip.setPointerCapture(e.pointerId);   // Bewegung weiter verfolgen, auch außerhalb des Symbols
  card.classList.add('drag');
  e.preventDefault();
});
$('#listArea').addEventListener('pointermove', e => {
  if (!drag) return;
  drag.card.style.transform = `translateY(${e.clientY - drag.startY}px)`;   // Karte folgt dem Finger
  let best = null, bd = 1e9, mid = 0;                                       // nächstgelegene andere Karte suchen
  document.querySelectorAll('.lcard').forEach(c => {
    if (c === drag.card) return;
    const r = c.getBoundingClientRect(), m = r.top + r.height / 2;
    if (Math.abs(e.clientY - m) < bd) { bd = Math.abs(e.clientY - m); best = c; mid = m; }
  });
  document.querySelectorAll('.drop-before,.drop-after').forEach(c => c.classList.remove('drop-before', 'drop-after'));
  drag.t = best; drag.after = e.clientY > mid;
  if (best) best.classList.add(drag.after ? 'drop-after' : 'drop-before');   // Linie zeigt die Zielstelle
});
function endDrag(e) {
  if (!drag) return;
  const d = drag; drag = null;
  if (e.type === 'pointerup' && d.t) {
    const l = S.lists.find(x => x.id === d.id), t = S.lists.find(x => x.id === d.t.dataset.l);
    S.lists = S.lists.filter(x => x !== l);
    l.cat = t.cat;                                                    // landet in der Kategorie des Ziels
    S.lists.splice(S.lists.indexOf(t) + (d.after ? 1 : 0), 0, l);
    save();
  }
  render();
}
$('#listArea').addEventListener('pointerup', endDrag);
$('#listArea').addEventListener('pointercancel', endDrag);
let editingCat = null;
function openCat(id) {                       // id = null: neue Kategorie
  editingCat = id ? S.cats.find(x => x.id === id) : null;
  $('#cName').value = editingCat ? editingCat.name : '';
  $('#cDel').hidden = !editingCat;
  $('#catDlg').showModal();
}
$('#cSave').onclick = () => {
  const n = $('#cName').value.trim();
  if (n) { if (editingCat) editingCat.name = n; else S.cats.push({ id: uid(), name: n }); save(); }
  $('#catDlg').close(); render();
};
$('#cDel').onclick = () => {                  // die Listen darin bleiben erhalten, sind dann ohne Kategorie
  S.cats = S.cats.filter(x => x !== editingCat);
  S.lists.forEach(l => { if (l.cat === editingCat.id) l.cat = ''; });
  save(); $('#catDlg').close(); render();
};
$('#cCancel').onclick = () => $('#catDlg').close();
$('#newCat').onclick = () => openCat(null);
// ⋯-Menü: Suchen oder Listen bearbeiten
$('#menuBtn').onclick = e => { e.stopPropagation(); $('#menu').hidden = !$('#menu').hidden; };
document.addEventListener('click', () => $('#menu').hidden = true);
$('#mSearch').onclick = () => { searchOn = true; sortMode = false; render(); $('#search').focus(); };
$('#mEdit').onclick = () => { sortMode = true; searchOn = false; $('#search').value = ''; render(); };
$('#closeSearch').onclick = () => { searchOn = false; $('#search').value = ''; render(); };
$('#doneBtn').onclick = () => { sortMode = false; render(); };
$('#search').oninput = render;

// ---------- Klicks ----------
$('#listArea').onclick = e => {
  if (e.target.closest('.grip')) return;   // Ziehen nicht als Tippen werten
  const card = e.target.closest('.lcard'), ce = e.target.closest('[data-cedit]');
  if (ce) return openCat(ce.closest('.cat').dataset.c);
  const hd = e.target.closest('.cat');         // Tippen auf die Kategorie: ein-/ausklappen
  if (hd && !sortMode) { const c = S.cats.find(x => x.id === hd.dataset.c); c.collapsed = !c.collapsed; save(); return render(); }
  if (card) {
    if (sortMode) return openList(card.dataset.l);   // im Bearbeiten-Modus: Name, Icon, Farbe ändern
    cur = card.dataset.l; render();
  }
};
$('#todos').onclick = e => {
  const li = e.target.closest('.todo'); if (!li) return;
  e.target.closest('.check') ? toggle(li.dataset.id) : openTodo(li.dataset.id);
};
$('#back').onclick = () => { cur = null; render(); };
$('#addList').onclick = () => openList(null);

// ＋ bei den Todos: öffnet den Dialog mit einem neuen, noch leeren Todo
$('#addTodo').onclick = () => openTodo({ id: uid(), title: '', done: false, doneAt: 0, lists: [cur], mode: 'strike', repeat: 0, due: '', note: '' });

// ---------- Todo-Dialog ----------
function openTodo(id) {
  editTodo = typeof id === 'object' ? id : S.todos.find(x => x.id === id);  // Objekt = neues Todo
  $('#tTitle').value = editTodo.title; $('#tDue').value = editTodo.due || '';
  $('#tNote').value = editTodo.note || ''; $('#tMode').value = editTodo.mode; $('#tUnit').value = editTodo.unit || (editTodo.repeat > 0 ? 'days' : 'none');
  $('#tRepeat').value = editTodo.repeat > 0 ? editTodo.repeat : 1;
  $('#tWd').innerHTML = [['Mo', 1], ['Di', 2], ['Mi', 3], ['Do', 4], ['Fr', 5], ['Sa', 6], ['So', 0]].map(([n, v]) =>
    `<label class="wd"><input type="checkbox" value="${v}" ${(editTodo.wdays || []).includes(v) ? 'checked' : ''}>${n}</label>`).join('');
  syncRepeat();
  $('#tLists').innerHTML = S.lists.map(l =>
    `<label class="pick"><input type="checkbox" value="${l.id}" ${editTodo.lists.includes(l.id) ? 'checked' : ''}><span class="dot sm" style="background:${l.color}"><span class="ic">${l.icon}</span></span>${esc(l.name)}</label>`
  ).join('');
  $('#todoDlg').showModal();
}
$('#tSave').onclick = () => {
  Object.assign(editTodo, {
    title: $('#tTitle').value.trim() || editTodo.title, due: $('#tDue').value, note: $('#tNote').value.trim(),
    mode: $('#tMode').value, unit: $('#tUnit').value,
    repeat: ['days', 'hours'].includes($('#tUnit').value) ? Math.max(1, Math.floor(+$('#tRepeat').value || 1)) : 0,
    wdays: [...document.querySelectorAll('#tWd input:checked')].map(i => +i.value),
    lists: [...document.querySelectorAll('#tLists input:checked')].map(i => i.value)
  });
  if (editTodo.done) editTodo.reopenAt = nextReopen(editTodo);   // Wiederholung geändert: neu berechnen
  if (!S.todos.includes(editTodo)) {            // neues Todo: nur speichern, wenn es einen Titel hat
    if (editTodo.title) S.todos.push(editTodo);
  }
  save(); $('#todoDlg').close(); render();
};
$('#tDel').onclick = () => { S.todos = S.todos.filter(t => t !== editTodo); save(); $('#todoDlg').close(); render(); };
$('#tCancel').onclick = () => $('#todoDlg').close();

// ---------- Listen-Dialog ----------
function drawIcons() {
  $('#lIcons').innerHTML = ICONS.map(i => `<button type="button" class="${i === pickedIcon ? 'on' : ''}">${i}</button>`).join('');
}
function openList(id) {
  editList = id ? S.lists.find(l => l.id === id) : null;
  $('#lName').value = editList ? editList.name : '';
  const col = editList ? editList.color : '#f6c6d8';
  $('#lColor').value = col; $('#lHex').value = col;
  pickedIcon = editList ? editList.icon : '📝'; drawIcons();
  $('#lCat').innerHTML = '<option value="">Keine</option>' + S.cats.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
  $('#lCat').value = editList ? editList.cat : '';
  $('#lDel').dataset.sure = ''; $('#lDel').textContent = 'Löschen';
  $('#lDel').hidden = !editList;
  $('#listDlg').showModal();
}
$('#lIcons').onclick = e => { if (e.target.tagName === 'BUTTON') { pickedIcon = e.target.textContent; drawIcons(); } };
$('#lColor').oninput = () => $('#lHex').value = $('#lColor').value;                       // Farbkreis -> Hex
$('#lHex').oninput = () => { if (/^#[0-9a-f]{6}$/i.test($('#lHex').value)) $('#lColor').value = $('#lHex').value; }; // Hex -> Farbkreis
$('#lSave').onclick = () => {
  const name = $('#lName').value.trim() || 'Neue Liste';
  const color = /^#[0-9a-f]{6}$/i.test($('#lHex').value) ? $('#lHex').value : $('#lColor').value;
  if (editList) Object.assign(editList, { name, color, icon: pickedIcon, cat: $('#lCat').value });
  else { S.lists.push({ id: uid(), name, color, icon: pickedIcon, cat: $('#lCat').value }); }
  save(); $('#listDlg').close(); render();
};
$('#lDel').onclick = () => {
  if ($('#lDel').dataset.sure !== '1') {      // erst Tippen = nachfragen, zweites Tippen = löschen
    $('#lDel').dataset.sure = '1'; $('#lDel').textContent = 'Wirklich löschen?'; return;
  }
  S.lists = S.lists.filter(l => l !== editList);
  S.todos.forEach(t => t.lists = t.lists.filter(id => id !== editList.id));
  S.todos = S.todos.filter(t => t.lists.length);   // Todos, die nur in dieser Liste waren, verschwinden mit ihr
  cur = null; save(); $('#listDlg').close(); render();
};
$('#lCancel').onclick = () => $('#listDlg').close();

render();
matchMedia('(min-width:700px)').addEventListener('change', render); // neu zeichnen, wenn das Fenster breiter/schmaler wird
setInterval(render, 60000); // Wiederholungen jede Minute prüfen
</script>
</body>
</html>
